name: CD

on:
  pull_request:
    types: [closed]
    branches: [develop]

concurrency:
  group: cd-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  validate:
    name: Post-Merge Validation
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ReSys.App.slnx --verbosity quiet

      - name: Build
        run: dotnet build ReSys.App.slnx --configuration ${{ env.CONFIGURATION }} --verbosity quiet --no-restore

      - name: Test + Coverage
        run: |
          dotnet test ReSys.App.slnx \
            --configuration ${{ env.CONFIGURATION }} \
            --verbosity quiet \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura,json \
            /p:IncludeBranchCoverage=true \
            /p:CoverletOutput="${{ github.workspace }}/coverage/"

      - name: Enforce Coverage ≥ 80%
        run: |
          dotnet test ReSys.App.slnx \
            --configuration ${{ env.CONFIGURATION }} \
            --verbosity quiet \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura,json \
            /p:IncludeBranchCoverage=true \
            /p:CoverletThreshold=80 \
            /p:CoverletThresholdType=line \
            /p:CoverletOutput="${{ github.workspace }}/coverage/"

      - name: Lint
        run: dotnet build ReSys.App.slnx --configuration ${{ env.CONFIGURATION }} --verbosity quiet -p:RunAnalyzers=true -p:RunAnalyzersDuringBuild=true

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-develop
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore
