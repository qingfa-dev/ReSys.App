name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - "feature/**"
      - "hotfix/**"
      - "release/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ReSys.App.slnx --verbosity quiet

      - name: Build
        run: dotnet build ReSys.App.slnx --configuration ${{ env.CONFIGURATION }} --verbosity quiet --no-restore

      - name: Test + Coverage
        run: |
          dotnet test ReSys.App.slnx \
            --configuration ${{ env.CONFIGURATION }} \
            --verbosity quiet \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura,json \
            /p:IncludeBranchCoverage=true \
            /p:CoverletOutput="${{ github.workspace }}/coverage/"

      - name: Format Check
        if: github.event_name == 'pull_request'
        run: dotnet format ReSys.App.slnx --verify-no-changes --verbosity diagnostic

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
